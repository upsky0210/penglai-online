# 蓬萊異聞錄 Online — nginx site (installed by deploy/ubuntu/penglai-deploy.sh)
# Serves the built client and proxies the game server, so students and teachers
# only ever connect to port 80. The client, when not on a dev port, talks to the
# same origin: WebSocket at /ws and the HTTP API at the paths below.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream penglai_server {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/penglai-online/client/dist;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Game WebSocket (client connects to /ws?slot=...).
    location = /ws {
        proxy_pass http://penglai_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A class lasts longer than nginx's 60s default idle timeout.
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }

    # HTTP API served by the game server.
    location ~ ^/(health|feedback)$ {
        proxy_pass http://penglai_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(auth|account|admin)/ {
        proxy_pass http://penglai_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Load/broadcast diagnostics have no token, so nginx never serves them. An
    # IP allow-list would not be enough: a Cloudflare Tunnel also arrives from
    # 127.0.0.1. On the server itself use: curl http://127.0.0.1:8787/debug/load-stats
    location ^~ /debug/ {
        return 404;
    }

    # Built bundles and game art. Short cache so updated art shows up the next day.
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
