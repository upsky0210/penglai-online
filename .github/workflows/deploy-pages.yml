# Builds the standalone Anping prototype and publishes it to GitHub Pages.
# The default game needs no backend. The legacy ?online=1 route still needs one.
#
# One-time setup (repo Settings):
#   1. Pages -> Build and deployment -> Source: "GitHub Actions".
#   2. Optional variables for the legacy online route only:
#        PENGLAI_SERVER_URL     e.g. https://penglai.example.org
#        VITE_GOOGLE_CLIENT_ID  Google Web OAuth Client ID          (optional)
#   3. For legacy online only: AUTH_CORS_ORIGIN=https://<owner>.github.io
#
# Manual trigger only, so nothing is published by an ordinary push.
name: Deploy client to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build client
        run: npm --workspace client run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ${{ vars.PENGLAI_SERVER_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
